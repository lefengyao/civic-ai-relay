<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Civic Relay 管理台</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --border:#e3e8f0; --text:#1c2433; --muted:#6b7688;
  --accent:#3b5bdb; --accent-soft:#eef2ff; --green:#0f9d6e; --green-soft:#e6f7f0;
  --red:#d64545; --red-soft:#fdecec; --amber:#b7791f; --amber-soft:#fdf3e0;
  --sidebar:#ffffff; --shadow:0 1px 3px rgba(28,36,51,.06),0 8px 24px rgba(28,36,51,.05);
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55}
button{font:inherit;cursor:pointer;border:none;border-radius:8px;transition:background .18s,box-shadow .18s,transform .1s}
button:active{transform:translateY(1px)}
input,select{font:inherit;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);outline:none;transition:border-color .18s,box-shadow .18s;width:100%}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{background:var(--accent);color:#fff;padding:9px 18px;font-weight:500}
.btn:hover{background:#3352c4}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);padding:8px 14px}
.btn-ghost:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-danger:hover{background:#f9d9d9}
.btn-sm{padding:5px 12px;font-size:13px}

/* ── 布局 ─────────────────────────── */
#login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#eef2ff 0%,#f4f6fb 55%,#e6f7f0 100%);z-index:50}
.login-card{background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:40px 44px;width:360px;animation:rise .45s ease both}
.login-card h1{margin:0 0 4px;font-size:22px}
.login-card p{margin:0 0 24px;color:var(--muted);font-size:13px}
.login-card .logo{width:46px;height:46px;border-radius:12px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;margin-bottom:16px}
.login-card input{margin-bottom:14px}
.login-error{color:var(--red);font-size:13px;min-height:18px;margin:0 0 8px}

#shell{display:none;height:100vh}
#shell.on{display:flex}
aside{width:224px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.brand b{font-size:16px}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:400}
nav{display:flex;flex-direction:column;gap:2px;flex:1}
nav button{display:flex;align-items:center;gap:10px;text-align:left;background:none;color:var(--muted);padding:10px 12px;border-radius:9px;font-size:14px;transition:background .18s,color .18s}
nav button:hover{background:var(--accent-soft);color:var(--accent)}
nav button.active{background:var(--accent);color:#fff;font-weight:500}
nav svg{width:17px;height:17px;flex-shrink:0}
.side-foot{border-top:1px solid var(--border);padding:14px 10px 2px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c2cad6;margin-right:6px;transition:background .3s}
.dot.ok{background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.dot.bad{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}

main{flex:1;overflow-y:auto;padding:26px 32px 48px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.topbar h2{margin:0;font-size:20px}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:2px}
.view{display:none;max-width:1060px}
.view.active{display:block;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── 卡片与表格 ────────────────────── */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px;transition:box-shadow .2s}
.card:hover{box-shadow:0 2px 6px rgba(28,36,51,.08),0 12px 32px rgba(28,36,51,.07)}
.card h3{margin:0 0 14px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;animation:rise .35s ease both}
.stat .label{color:var(--muted);font-size:12px;margin-bottom:6px}
.stat .value{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .hint{font-size:12px;color:var(--muted);margin-top:4px}
.bar{height:5px;border-radius:3px;background:var(--accent-soft);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .6s ease}
.bar i.warn{background:var(--amber)}
.bar i.full{background:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px;border-bottom:1px solid #f0f3f8;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .15s}
tbody tr:hover{background:#f8faff}
.mono{font-family:Consolas,monospace;font-size:12.5px}
.empty{color:var(--muted);text-align:center;padding:26px 0}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:500}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.off{background:#eef0f4;color:var(--muted)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.err{background:var(--red-soft);color:var(--red)}

/* ── 开关 ─────────────────────────── */
.switch{position:relative;display:inline-block;width:38px;height:21px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .track{position:absolute;inset:0;background:#cbd3e0;border-radius:21px;transition:background .22s;cursor:pointer}
.switch .track::after{content:"";position:absolute;top:2.5px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.4,0,.2,1)}
.switch input:checked+.track{background:var(--green)}
.switch input:checked+.track::after{transform:translateX(16px)}
.switch input:disabled+.track{opacity:.45;cursor:not-allowed}

/* ── 表单 ─────────────────────────── */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.form-actions{margin-top:14px;display:flex;gap:10px;align-items:center}
details.add-box{margin-bottom:18px}
details.add-box summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);padding:9px 16px;border-radius:9px;font-weight:500;transition:background .18s;user-select:none}
details.add-box summary:hover{background:#e0e7ff}
details.add-box summary::-webkit-details-marker{display:none}
details.add-box[open] summary{margin-bottom:14px}
details .card{margin-bottom:0}
.check-list{display:flex;flex-wrap:wrap;gap:8px}
.check-item{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;transition:all .15s;font-size:13px;background:#fff}
.check-item:hover{border-color:var(--accent)}
.check-item.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.check-item input{width:auto;margin:0}

/* ── Toast / 弹窗 ─────────────────── */
#toasts{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:#1c2433;color:#fff;padding:11px 18px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:13.5px;animation:toastIn .28s cubic-bezier(.34,1.4,.64,1) both;max-width:340px}
.toast.err{background:var(--red)}
.toast.ok{background:var(--green)}
.toast.out{animation:toastOut .25s ease both}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(40px)}}
#modal{position:fixed;inset:0;background:rgba(20,26,40,.45);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px)}
#modal.on{display:flex}
.modal-box{background:#fff;border-radius:16px;padding:30px 34px;width:440px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .3s cubic-bezier(.34,1.4,.64,1) both}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.modal-box h3{margin:0 0 8px}
.modal-box p{color:var(--muted);font-size:13px;margin:0 0 16px}
.token-box{display:flex;gap:8px}
.token-box code{flex:1;background:#f4f6fb;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:Consolas,monospace;font-size:12.5px;word-break:break-all}
.skeleton{background:linear-gradient(90deg,#eef1f6 25%,#f7f9fc 50%,#eef1f6 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:6px;height:14px;margin:10px 0}
@keyframes shimmer{to{background-position:-200% 0}}
.trend{display:flex;align-items:flex-end;gap:5px;height:110px;padding-top:8px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.trend .col i{display:block;width:100%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.85;transition:height .5s ease}
.trend .col span{font-size:10px;color:var(--muted);white-space:nowrap}
.kv{display:grid;grid-template-columns:200px 1fr;gap:8px 14px;align-items:center}
.kv .k{color:var(--muted);font-size:13px}
@media(max-width:900px){
  #shell.on{flex-direction:column;height:auto}
  aside{width:100%;flex-direction:row;align-items:center;padding:10px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border)}
  nav{flex-direction:row}
  .side-foot,.brand small{display:none}
  main{padding:18px}
}
</style>
</head>
<body>

<!-- 登录 -->
<div id="login-screen">
  <div class="login-card">
    <div class="logo">CR</div>
    <h1>Civic Relay</h1>
    <p>输入管理员密钥进入内网管理台</p>
    <input id="admin-key" type="password" placeholder="管理员密钥" autocomplete="current-password">
    <p id="login-error" class="login-error"></p>
    <button id="login-button" class="btn" style="width:100%">进入管理台</button>
  </div>
</div>

<!-- 主界面 -->
<div id="shell">
  <aside>
    <div class="brand"><div class="logo">CR</div><div><b>Civic Relay</b><small>内网统一转发网关</small></div></div>
    <nav id="nav">
      <button data-view="overview" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>运行概览</button>
      <button data-view="providers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="7" rx="2"/><rect x="2" y="13" width="20" height="7" rx="2"/><circle cx="6" cy="7.5" r="1" fill="currentColor" stroke="none"/><circle cx="6" cy="16.5" r="1" fill="currentColor" stroke="none"/></svg>供应商</button>
      <button data-view="models"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4.5v9L12 20l-8-4.5v-9L12 2z"/><path d="M12 11l8-4.5M12 11v9M12 11L4 6.5"/></svg>模型</button>
      <button data-view="groups"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="12" cy="18" r="3"/><path d="M7.5 8.5L10.5 15.5M16.5 8.5L13.5 15.5M9 6h6"/></svg>模型组</button>
      <button data-view="keys"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="M11 12L21 2M17 6l3 3M14 9l2 2"/></svg>客户端 Key</button>
      <button data-view="requests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>请求日志</button>
      <button data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 110-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V2a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>运行配置</button>
    </nav>
    <div class="side-foot"><span class="dot" id="svc-dot"></span><span id="svc-text">未连接</span></div>
  </aside>

  <main>
    <div class="topbar">
      <div><h2 id="page-title">运行概览</h2><div class="sub" id="page-sub"></div></div>
      <button class="btn-ghost" id="refresh-btn">↻ 刷新</button>
    </div>

    <!-- 概览 -->
    <section id="view-overview" class="view active">
      <div class="stats" id="stat-cards"></div>
      <div class="card"><h3>近一小时请求趋势（每 5 分钟）</h3><div class="trend" id="trend-chart"></div></div>
      <div class="card"><h3>最近请求</h3><div id="overview-recent"></div></div>
    </section>

    <!-- 供应商 -->
    <section id="view-providers" class="view">
      <details class="add-box"><summary>＋ 添加供应商</summary>
        <div class="card"><form id="provider-form">
          <div class="form-grid">
            <div class="field"><label>名称</label><input name="name" required placeholder="例如 OpenAI 官方"></div>
            <div class="field"><label>上游地址（HTTPS）</label><input name="base_url" required placeholder="https://api.example.com/v1"></div>
            <div class="field"><label>上游 API Key</label><input name="api_key" type="password" required placeholder="sk-..."></div>
          </div>
          <div class="form-actions"><button class="btn">添加供应商</button><span class="sub" style="color:var(--muted);font-size:12px">Key 将使用 AES-256-GCM 加密存储</span></div>
        </form></div>
      </details>
      <div class="card"><h3>供应商列表</h3><div id="provider-data"></div></div>
    </section>

    <!-- 模型 -->
    <section id="view-models" class="view">
      <details class="add-box"><summary>＋ 添加模型</summary>
        <div class="card"><form id="model-form">
          <div class="form-grid">
            <div class="field"><label>所属供应商</label><select name="provider_id" id="model-provider-select" required></select></div>
            <div class="field"><label>对外名称</label><input name="public_name" required placeholder="provider/model"></div>
            <div class="field"><label>上游模型名</label><input name="upstream_name" required placeholder="gpt-4o-mini"></div>
            <div class="field"><label>输入单价（元 / 百万 Token）</label><input name="input_price" type="number" step="0.000001" min="0" required placeholder="2.5"></div>
            <div class="field"><label>输出单价（元 / 百万 Token）</label><input name="output_price" type="number" step="0.000001" min="0" required placeholder="10"></div>
          </div>
          <div class="form-actions"><button class="btn">添加模型</button></div>
        </form></div>
      </details>
      <div class="card"><h3>模型列表</h3><div id="model-data"></div></div>
    </section>

    <!-- 模型组 -->
    <section id="view-groups" class="view">
      <details class="add-box"><summary>＋ 创建模型组</summary>
        <div class="card"><form id="group-form">
          <div class="field" style="margin-bottom:12px"><label>组名</label><input name="name" required placeholder="例如 默认组" style="max-width:280px"></div>
          <div class="field"><label>包含的模型（需已启用且已定价）</label><div class="check-list" id="group-model-checks"></div></div>
          <div class="form-actions"><button class="btn">创建模型组</button></div>
        </form></div>
      </details>
      <div class="card"><h3>模型组列表</h3><div id="group-data"></div></div>
    </section>

    <!-- 客户端 Key -->
    <section id="view-keys" class="view">
      <details class="add-box"><summary>＋ 创建客户端 Key</summary>
        <div class="card"><form id="key-form">
          <div class="form-grid">
            <div class="field"><label>名称</label><input name="name" required placeholder="例如 办公室共用"></div>
            <div class="field"><label>最大并发</label><input name="max_concurrency" type="number" min="1" value="1" required></div>
            <div class="field"><label>总 Token 限额（可选）</label><input name="token_limit" type="number" min="0" placeholder="留空表示不限"></div>
            <div class="field"><label>总金额限额（元，可选）</label><input name="money_limit" type="number" step="0.01" min="0" placeholder="留空表示不限"></div>
          </div>
          <div class="field" style="margin-top:12px"><label>授权模型组</label><div class="check-list" id="key-group-checks"></div></div>
          <div class="form-actions"><button class="btn">创建 Key</button></div>
        </form></div>
      </details>
      <div class="card"><h3>客户端 Key 列表</h3><div id="key-data"></div></div>
    </section>

    <!-- 请求日志 -->
    <section id="view-requests" class="view">
      <div class="card"><h3>最近 50 条请求（仅元数据，不含对话内容）</h3><div id="request-data"></div></div>
    </section>

    <!-- 运行配置 -->
    <section id="view-settings" class="view">
      <div class="card"><h3>运行配置（环境变量）</h3>
        <p style="color:var(--muted);font-size:12.5px;margin-top:0">密钥类字段留空表示保持不变。带 ⚠ 标记的修改需要重启进程才能生效。</p>
        <div class="kv" id="settings-kv"></div>
        <div class="form-actions"><button class="btn" id="save-config">保存配置</button><span id="config-result" style="font-size:12.5px;color:var(--muted)"></span></div>
      </div>
    </section>
  </main>
</div>

<!-- Token 弹窗 -->
<div id="modal"><div class="modal-box">
  <h3>🎉 Key 创建成功</h3>
  <p>客户端明文密钥<b>只显示这一次</b>，请立即复制保存：</p>
  <div class="token-box"><code id="modal-token"></code><button class="btn" id="copy-token">复制</button></div>
  <div style="text-align:right;margin-top:18px"><button class="btn-ghost" id="modal-close">我已保存</button></div>
</div></div>

<div id="toasts"></div>

<script>
"use strict";
let adminKey = sessionStorage.getItem("cr_admin_key") || "";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtYuan = micro => micro == null ? "—" : "¥" + (micro / 1e6).toFixed(micro % 1e6 === 0 ? 2 : 6).replace(/\.?0+$/, m => m.length > 3 ? m : "");
const fmtNum = n => Number(n ?? 0).toLocaleString("zh-CN");
const fmtTime = t => { if (!t) return "—"; const d = new Date(t); return isNaN(d) ? t : d.toLocaleString("zh-CN", { hour12: false }); };

function toast(msg, type = "") {
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.textContent = msg;
  $("toasts").appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 260); }, type === "err" ? 4200 : 2600);
}

async function api(path, options = {}) {
  const headers = new Headers(options.headers || {});
  headers.set("X-Admin-Key", adminKey);
  const r = await fetch(path, { ...options, headers });
  if (r.status === 401) { logout(); throw new Error("认证失败"); }
  return r;
}
async function apiJSON(path, options) {
  const r = await api(path, options);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body?.error?.message || ("请求失败 (" + r.status + ")"));
  return body;
}

function logout() {
  adminKey = ""; sessionStorage.removeItem("cr_admin_key");
  $("shell").classList.remove("on"); $("login-screen").style.display = "flex";
  setSvc(false, "未连接");
}
function setSvc(ok, text) {
  $("svc-dot").className = "dot " + (ok ? "ok" : "bad");
  $("svc-text").textContent = text;
}

/* ── 状态缓存 ── */
const cache = { providers: [], models: [], groups: [], keys: [] };

/* ── 登录 ── */
async function login() {
  adminKey = $("admin-key").value;
  $("login-error").textContent = "";
  try {
    await apiJSON("/admin/api/overview");
    sessionStorage.setItem("cr_admin_key", adminKey);
    $("login-screen").style.display = "none";
    $("shell").classList.add("on");
    setSvc(true, "服务正常");
    toast("欢迎回来", "ok");
    await refreshView(currentView);
  } catch (e) {
    $("login-error").textContent = e.message === "认证失败" ? "管理员密钥无效" : "无法连接服务：" + e.message;
    setSvc(false, "连接失败");
  }
}
$("login-button").onclick = login;
$("admin-key").addEventListener("keydown", e => { if (e.key === "Enter") login(); });

/* ── 视图切换 ── */
const titles = {
  overview: ["运行概览", "服务运行状态与用量统计"],
  providers: ["供应商", "管理上游 OpenAI 兼容服务"],
  models: ["模型", "对外模型目录与定价"],
  groups: ["模型组", "将模型打包授权给客户端"],
  keys: ["客户端 Key", "向局域网客户端发放的访问凭据"],
  requests: ["请求日志", "最近的请求元数据"],
  settings: ["运行配置", "查看与修改运行参数"],
};
let currentView = "overview";
const loaders = {
  overview: loadOverview, providers: loadProviders, models: loadModels,
  groups: loadGroups, keys: loadKeys, requests: loadRequests, settings: loadConfig,
};
async function refreshView(v) {
  $("page-title").textContent = titles[v][0];
  $("page-sub").textContent = titles[v][1];
  try { await loaders[v](); } catch (e) { if (e.message !== "认证失败") toast(e.message, "err"); }
}
$("nav").addEventListener("click", e => {
  const btn = e.target.closest("[data-view]");
  if (!btn) return;
  currentView = btn.dataset.view;
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b === btn));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + currentView));
  refreshView(currentView);
});
$("refresh-btn").onclick = () => refreshView(currentView);

/* ── 概览 ── */
function statCard(label, value, hint, pct) {
  const cls = pct >= 100 ? "full" : pct >= 80 ? "warn" : "";
  return `<div class="stat"><div class="label">${esc(label)}</div><div class="value">${value}</div><div class="hint">${hint}</div>` +
    (pct != null ? `<div class="bar"><i class="${cls}" style="width:${Math.min(pct, 100)}%"></i></div>` : "") + `</div>`;
}
async function loadOverview() {
  const d = await apiJSON("/admin/api/overview");
  setSvc(true, "服务正常");
  const rpmPct = d.rpm.limit ? d.rpm.used / d.rpm.limit * 100 : 0;
  const fivePct = d.five_hour.limit ? d.five_hour.used_tokens / d.five_hour.limit * 100 : 0;
  const dailyPct = d.daily.limit ? d.daily.used_tokens / d.daily.limit * 100 : 0;
  const lh = d.last_hour || {};
  const errPct = Math.round((lh.error_rate || 0) * 100);
  const conc = d.concurrency || { active: 0, limit: "—" };
  $("stat-cards").innerHTML =
    statCard("RPM（每分钟请求）", `${fmtNum(d.rpm.used)} <span style="font-size:13px;color:var(--muted)">/ ${fmtNum(d.rpm.limit)}</span>`, "全局滚动一分钟", rpmPct) +
    statCard("5 小时 Token", fmtNum(d.five_hour.used_tokens), `限额 ${fmtNum(d.five_hour.limit)}`, fivePct) +
    statCard("当日 Token（北京时间）", fmtNum(d.daily.used_tokens), `限额 ${fmtNum(d.daily.limit)}`, dailyPct) +
    statCard("并发", `${fmtNum(conc.active)} <span style="font-size:13px;color:var(--muted)">/ ${esc(conc.limit)}</span>`, "当前进行中的请求", null) +
    statCard("近一小时成功率", lh.completed + lh.failed ? (100 - errPct) + "%" : "—", `成功 ${fmtNum(lh.completed)} · 失败 ${fmtNum(lh.failed)}`, null);
  const max = Math.max(1, ...(d.trend || []).map(t => t.count));
  $("trend-chart").innerHTML = (d.trend || []).map(t => {
    const h = Math.round(t.count / max * 100);
    return `<div class="col" title="${esc(fmtTime(t.started_at_utc))}：${t.count} 次"><i style="height:${h}%" ${t.count ? "" : 'style="opacity:.2;height:2px"'}></i><span>${t.count}</span></div>`;
  }).join("");
  renderRequests(d.recent || [], "overview-recent");
}

/* ── 请求表 ── */
function statusTag(s) {
  const map = { completed: ["ok", "完成"], failed: ["err", "失败"], aborted: ["warn", "中止"], rejected: ["warn", "拒绝"], reserved: ["warn", "进行中"] };
  const [cls, label] = map[s] || ["off", s];
  return `<span class="tag ${cls}">${esc(label)}</span>`;
}
function renderRequests(list, target) {
  if (!list.length) { $(target).innerHTML = `<div class="empty">暂无请求记录</div>`; return; }
  $(target).innerHTML = `<table><thead><tr><th>时间</th><th>状态</th><th>输入</th><th>输出</th><th>金额</th><th>流式</th><th>上游码</th></tr></thead><tbody>` +
    list.map(r => `<tr><td class="mono">${esc(fmtTime(r.created_at_utc))}</td><td>${statusTag(r.status)}</td><td>${fmtNum(r.input_tokens)}</td><td>${fmtNum(r.output_tokens)}</td><td>${fmtYuan(r.amount_microyuan)}</td><td>${r.streamed ? "是" : "否"}</td><td class="mono">${r.upstream_status ?? "—"}</td></tr>`).join("") +
    `</tbody></table>`;
}

/* ── 供应商 ── */
async function loadProviders() {
  const d = await apiJSON("/admin/api/providers");
  cache.providers = d.data || [];
  if (!cache.providers.length) { $("provider-data").innerHTML = `<div class="empty">还没有供应商，点击上方按钮添加</div>`; return; }
  $("provider-data").innerHTML = `<table><thead><tr><th>ID</th><th>名称</th><th>上游地址</th><th>Key</th><th>状态</th><th>操作</th></tr></thead><tbody>` +
    cache.providers.map(p => `<tr>
      <td class="mono">${p.ID}</td><td><b>${esc(p.Name)}</b></td><td class="mono">${esc(p.BaseURL)}</td>
      <td>${p.APIKeyConfigured ? `<span class="tag ok">已配置</span>` : `<span class="tag err">未配置</span>`}</td>
      <td><label class="switch"><input type="checkbox" ${p.Enabled ? "checked" : ""} onchange="toggleProvider(${p.ID},this)"><span class="track"></span></label></td>
      <td><button class="btn-ghost btn-sm" onclick="editProvider(${p.ID})">改名 / 换 Key</button></td>
    </tr>`).join("") + `</tbody></table>`;
}
window.toggleProvider = async (id, el) => {
  try { await apiJSON("/admin/api/providers/" + id, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ Enabled: el.checked }) }); toast(el.checked ? "供应商已启用" : "供应商已停用", "ok"); }
  catch (e) { el.checked = !el.checked; toast(e.message, "err"); }
};
window.editProvider = async id => {
  const p = cache.providers.find(x => x.ID === id);
  const name = prompt("供应商名称：", p.Name); if (name === null) return;
  const key = prompt("新的上游 API Key（留空则不变）：", "");
  if (key === null) return;
  try {
    await apiJSON("/admin/api/providers/" + id, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ Name: name, ...(key ? { APIKey: key } : {}) }) });
    toast("供应商已更新", "ok"); loadProviders();
  } catch (e) { toast(e.message, "err"); }
};
$("provider-form").onsubmit = async e => {
  e.preventDefault();
  try {
    await apiJSON("/admin/api/providers", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
    toast("供应商已添加", "ok"); e.target.reset(); loadProviders();
  } catch (err) { toast(err.message, "err"); }
};

/* ── 模型 ── */
function renderProviderSelect() {
  $("model-provider-select").innerHTML = cache.providers.map(p => `<option value="${p.ID}">${esc(p.Name)}</option>`).join("");
}
function micro(v) { return v === "" || v == null ? null : Math.round(parseFloat(v) * 1e6); }
async function loadModels() {
  const d = await apiJSON("/admin/api/models");
  cache.models = d.data || [];
  renderProviderSelect();
  if (!cache.models.length) { $("model-data").innerHTML = `<div class="empty">还没有模型，点击上方按钮添加</div>`; return; }
  const pname = id => (cache.providers.find(p => p.ID === id) || {}).Name || ("#" + id);
  $("model-data").innerHTML = `<table><thead><tr><th>ID</th><th>供应商</th><th>对外名称</th><th>上游名称</th><th>输入价</th><th>输出价</th><th>状态</th></tr></thead><tbody>` +
    cache.models.map(m => `<tr>
      <td class="mono">${m.ID}</td><td>${esc(pname(m.ProviderID))}</td><td><b class="mono">${esc(m.PublicName)}</b></td><td class="mono">${esc(m.UpstreamName)}</td>
      <td>${fmtYuan(m.InputPriceMicroyuan)}</td><td>${fmtYuan(m.OutputPriceMicroyuan)}</td>
      <td><label class="switch"><input type="checkbox" ${m.Enabled ? "checked" : ""} onchange="toggleModel(${m.ID},this)"><span class="track"></span></label></td>
    </tr>`).join("") + `</tbody></table>`;
}
window.toggleModel = async (id, el) => {
  try { await apiJSON("/admin/api/models/" + id, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ Enabled: el.checked }) }); toast(el.checked ? "模型已启用" : "模型已停用", "ok"); }
  catch (e) { el.checked = !el.checked; toast(e.message, "err"); }
};
$("model-form").onsubmit = async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    await apiJSON("/admin/api/models", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({
      provider_id: Number(f.get("provider_id")), public_name: f.get("public_name"), upstream_name: f.get("upstream_name"),
      input_price_microyuan: micro(f.get("input_price")), output_price_microyuan: micro(f.get("output_price")), enabled: true,
    }) });
    toast("模型已添加", "ok"); e.target.reset(); loadModels();
  } catch (err) { toast(err.message, "err"); }
};

/* ── 模型组 ── */
function renderGroupChecks() {
  const okModels = cache.models.filter(m => m.Enabled && m.InputPriceMicroyuan != null && m.OutputPriceMicroyuan != null);
  $("group-model-checks").innerHTML = okModels.length ? okModels.map(m =>
    `<label class="check-item"><input type="checkbox" value="${m.ID}" onchange="this.closest('.check-item').classList.toggle('on',this.checked)"><span class="mono">${esc(m.PublicName)}</span></label>`).join("")
    : `<span style="color:var(--muted);font-size:13px">暂无可用模型（需已启用且已定价）</span>`;
}
async function loadGroups() {
  const d = await apiJSON("/admin/api/groups");
  cache.groups = d.data || [];
  renderGroupChecks();
  if (!cache.groups.length) { $("group-data").innerHTML = `<div class="empty">还没有模型组，点击上方按钮创建</div>`; return; }
  $("group-data").innerHTML = `<table><thead><tr><th>ID</th><th>组名</th><th>状态</th></tr></thead><tbody>` +
    cache.groups.map(g => `<tr><td class="mono">${g.ID}</td><td><b>${esc(g.Name)}</b></td><td>${g.Enabled ? `<span class="tag ok">启用</span>` : `<span class="tag off">停用</span>`}</td></tr>`).join("") + `</tbody></table>`;
}
$("group-form").onsubmit = async e => {
  e.preventDefault();
  const ids = [...$("group-model-checks").querySelectorAll("input:checked")].map(i => Number(i.value));
  try {
    await apiJSON("/admin/api/groups", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: new FormData(e.target).get("name"), model_ids: ids }) });
    toast("模型组已创建", "ok"); loadGroups();
  } catch (err) { toast(err.message, "err"); }
};

/* ── 客户端 Key ── */
function renderKeyGroupChecks() {
  $("key-group-checks").innerHTML = cache.groups.filter(g => g.Enabled).map(g =>
    `<label class="check-item"><input type="checkbox" value="${g.ID}" onchange="this.closest('.check-item').classList.toggle('on',this.checked)"><span>${esc(g.Name)}</span></label>`).join("")
    || `<span style="color:var(--muted);font-size:13px">暂无模型组，请先创建</span>`;
}
async function loadKeys() {
  const d = await apiJSON("/admin/api/keys");
  cache.keys = d.data || [];
  renderKeyGroupChecks();
  if (!cache.keys.length) { $("key-data").innerHTML = `<div class="empty">还没有客户端 Key，点击上方按钮创建</div>`; return; }
  $("key-data").innerHTML = `<table><thead><tr><th>ID</th><th>名称</th><th>并发</th><th>Token 已用限额</th><th>金额限额</th><th>状态</th><th>操作</th></tr></thead><tbody>` +
    cache.keys.map(k => `<tr>
      <td class="mono">${k.ID}</td><td><b>${esc(k.Name)}</b></td><td>${k.ConcurrencyLimit}</td>
      <td>${k.TokenLimit == null ? "不限" : fmtNum(k.TokenLimit)}</td><td>${k.AmountLimitMicroyuan == null ? "不限" : fmtYuan(k.AmountLimitMicroyuan)}</td>
      <td>${k.Enabled ? `<span class="tag ok">启用</span>` : `<span class="tag err">${esc(k.DisabledReason || "停用")}</span>`}</td>
      <td><label class="switch"><input type="checkbox" ${k.Enabled ? "checked" : ""} onchange="toggleKey(${k.ID},this)"><span class="track"></span></label></td>
    </tr>`).join("") + `</tbody></table>`;
}
window.toggleKey = async (id, el) => {
  try { await apiJSON("/admin/api/keys/" + id, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ Enabled: el.checked }) }); toast(el.checked ? "Key 已启用" : "Key 已停用", "ok"); }
  catch (e) { el.checked = !el.checked; toast(e.message, "err"); }
};
$("key-form").onsubmit = async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const body = { name: f.get("name"), max_concurrency: Number(f.get("max_concurrency")), group_ids: [...$("key-group-checks").querySelectorAll("input:checked")].map(i => Number(i.value)) };
  const tl = f.get("token_limit"), ml = f.get("money_limit");
  if (tl) body.token_limit_total = Number(tl);
  if (ml) body.money_limit_yuan_total = Number(ml);
  try {
    const r = await apiJSON("/admin/api/keys", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    e.target.reset(); loadKeys();
    if (r.token) { $("modal-token").textContent = r.token; $("modal").classList.add("on"); }
  } catch (err) { toast(err.message, "err"); }
};
$("copy-token").onclick = async () => {
  try { await navigator.clipboard.writeText($("modal-token").textContent); toast("已复制到剪贴板", "ok"); }
  catch { const r = document.createRange(); r.selectNodeContents($("modal-token")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("请按 Ctrl+C 复制"); }
};
$("modal-close").onclick = () => $("modal").classList.remove("on");

/* ── 请求日志 ── */
async function loadRequests() {
  const d = await apiJSON("/admin/api/requests");
  renderRequests(d.data || [], "request-data");
}

/* ── 运行配置 ── */
const restartKeys = ["HOST", "PORT", "DB_PATH", "RELAY_ENCRYPTION_KEY"];
async function loadConfig() {
  const d = await apiJSON("/admin/api/config");
  const s = d.settings || {};
  $("settings-kv").innerHTML = Object.entries(s).map(([k, v]) => {
    const secret = /KEY|SECRET/i.test(k);
    return `<div class="k mono">${esc(k)}${restartKeys.includes(k) ? ' <span style="color:var(--amber)">⚠</span>' : ""}</div><input data-cfg="${esc(k)}" type="${secret ? "password" : "text"}" value="${esc(v)}" placeholder="${secret ? "已设置（留空保持不变）" : ""}">`;
  }).join("");
}
$("save-config").onclick = async () => {
  const settings = {};
  $("settings-kv").querySelectorAll("input[data-cfg]").forEach(i => { settings[i.dataset.cfg] = i.value; });
  try {
    const r = await apiJSON("/admin/api/config", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ settings }) });
    const pend = (r.pending_restart_fields || []);
    $("config-result").textContent = "已保存" + (pend.length ? "；⚠ 以下字段需重启生效：" + pend.join(", ") : "，已即时生效");
    $("config-result").style.color = pend.length ? "var(--amber)" : "var(--green)";
    toast("配置已保存", "ok");
  } catch (e) { toast(e.message, "err"); }
};

/* ── 启动：已记住密钥则自动进入 ── */
if (adminKey) {
  login().then(() => { $("admin-key").value = ""; });
}
</script>
</body>
</html>
