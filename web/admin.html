<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Civic Relay 管理台</title>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f7fa;color:#1e2b3c}header{background:#18273b;color:#fff;padding:16px 22px}main{max-width:1100px;margin:24px auto;padding:0 16px}.panel{background:#fff;border:1px solid #dce4ed;border-radius:6px;padding:16px;margin:12px 0}button,input{padding:8px;border:1px solid #cbd7e4;border-radius:4px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.hidden{display:none}.error{color:#9a371f}.ok{color:#286747}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #edf1f5;text-align:left}</style></head>
<body><header><strong>Civic Relay</strong> <small>内网管理台</small><span id="status" style="float:right">等待登录</span></header>
<main><section id="login" class="panel"><h2>管理员登录</h2><input id="admin-key" type="password" placeholder="管理员密钥"><button id="login-button">进入管理台</button><p id="login-error" class="error"></p></section>
<section id="app" class="hidden"><nav class="panel"><button data-view="overview">运行概览</button> <button data-view="providers">供应商</button> <button data-view="models">模型</button> <button data-view="groups">模型组</button> <button data-view="keys">客户端 Key</button> <button data-view="settings">运行配置</button></nav>
<section id="overview" class="panel view"><h2>运行概览</h2><pre id="overview-data">加载中</pre></section>
<section id="providers" class="panel view hidden"><h2>供应商</h2><form id="provider-form"><input name="name" placeholder="名称" required><input name="base_url" placeholder="HTTPS 上游地址" required><input name="api_key" type="password" placeholder="上游 API Key" required><button>添加供应商</button></form><div id="provider-data"></div></section>
<section id="models" class="panel view hidden"><h2>模型</h2><div id="model-data"></div></section>
<section id="groups" class="panel view hidden"><h2>模型组</h2><div id="group-data"></div></section>
<section id="keys" class="panel view hidden"><h2>客户端 Key</h2><form id="key-form"><input name="name" placeholder="名称" required><input name="max_concurrency" type="number" min="1" value="1"><button>创建 Key</button></form><div id="key-data"></div></section>
<section id="settings" class="panel view hidden"><h2>运行配置</h2><pre id="settings-data"></pre></section></section></main>
<script>
let adminKey="";const $=id=>document.getElementById(id);async function api(path,options={}){const headers=new Headers(options.headers||{});headers.set("X-Admin-Key",adminKey);return fetch(path,{...options,headers})}async function load(){const r=await api("/admin/api/overview");if(!r.ok){$("status").textContent="登录已失效";return}$("overview-data").textContent=JSON.stringify(await r.json(),null,2);$("status").textContent="服务正常";const p=await api("/admin/api/providers");if(p.ok)$("provider-data").textContent=JSON.stringify((await p.json()).data,null,2);const k=await api("/admin/api/keys");if(k.ok)$("key-data").textContent=JSON.stringify((await k.json()).data,null,2);const s=await api("/admin/api/config");if(s.ok)$("settings-data").textContent=JSON.stringify((await s.json()).settings,null,2)}$("login-button").onclick=async()=>{adminKey=$("admin-key").value;const r=await api("/admin/api/overview");if(!r.ok){$("login-error").textContent="管理员密钥无效";return}$("login").classList.add("hidden");$("app").classList.remove("hidden");await load()};$("provider-form").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await api("/admin/api/providers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(f))});await load()};$("key-form").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const r=await api("/admin/api/keys",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:f.get("name"),max_concurrency:Number(f.get("max_concurrency"))})});const b=await r.json();if(b.token)alert("请立即保存此 Key："+b.token);await load()};document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>document.querySelectorAll(".view").forEach(v=>v.classList.toggle("hidden",v.id!==b.dataset.view)));
</script></body></html>
